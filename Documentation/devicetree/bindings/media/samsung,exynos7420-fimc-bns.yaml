%YAML 1.2
---
$id: http://devicetree.org/schemas/media/samsung,exynos7420-fimc-bns.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7420 FIMC-BNS Camera Interface

maintainers:
  - 404698-FDU <pro5-mainline@local>

properties:
  compatible:
    const: samsung,exynos7420-fimc-bns

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 8

  samsung,sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the SYSREG syscon.

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/properties/port

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false
