%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx230.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX230 21MP CMOS Image Sensor

maintainers:
  - 404698-FDU <pro5-mainline@local>

properties:
  compatible:
    const: sony,imx230

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-frequency:
    $ref: /schemas/types.yaml#/definitions/uint32

  vana-supply: true
  vdig-supply: true
  vif-supply: true
  vcm-supply: true
  vdrv-supply: true

  reset-gpios:
    maxItems: 1

  orientation:
    $ref: /schemas/types.yaml#/definitions/uint32

  rotation:
    $ref: /schemas/types.yaml#/definitions/uint32

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        additionalProperties: false

        properties:
          data-lanes:
            minItems: 1
            maxItems: 4
          link-frequencies: true
          remote-endpoint: true

required:
  - compatible
  - reg
  - clocks
  - port

additionalProperties: false
