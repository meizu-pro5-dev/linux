%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/audience,es705.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Audience eS705 Audio DSP

maintainers:
  - 404698-FDU <pro5-mainline@local>

properties:
  compatible:
    const: audience,es705

  reg:
    maxItems: 1

  spi-max-frequency: true
  spi-cpha: true

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    items:
      - const: mclk
      - const: clk32k

  vdd-core-supply: true

  reset-gpios:
    maxItems: 1

  wakeup-gpios:
    maxItems: 1

  "#sound-dai-cells":
    const: 1

  controller-data:
    type: object
    additionalProperties: true

required:
  - compatible
  - reg

additionalProperties: false
