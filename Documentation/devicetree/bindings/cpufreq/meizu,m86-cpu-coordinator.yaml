%YAML 1.2
---
$id: http://devicetree.org/schemas/cpufreq/meizu,m86-cpu-coordinator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Exynos7420 Dual-Cluster CPU Clock & Frequency Coordinator (Meizu PRO 5)

maintainers:
  - 404698-FDU <pro5-mainline@local>

properties:
  compatible:
    enum:
      - meizu,m86-cpu-coordinator
      - meizu,m86-atlas-clock
      - meizu,m86-apollo-clock

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 4

  clock-names:
    minItems: 1
    maxItems: 4

  "#clock-cells":
    const: 0

  apollo-supply: true
  atlas-supply: true

  samsung,bus:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the Exynos bus devfreq device for QoS floor voting.

  samsung,tmu:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: Phandle list of the Exynos7420 TMU thermal nodes.

  meizu,cpu-dvfs-active:
    type: boolean
    description: Enables active dual-cluster CPU DVFS management.

  meizu,ema-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the SRAM EMA SYSREG syscon.

  meizu,max-validated-khz:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Per-cluster maximum validated frequency limits in kHz.
    minItems: 2
    maxItems: 2

  meizu,max-validated-frequency:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Maximum validated cluster clock frequency in Hz.

  meizu,validated-fixed-bus-qos-floor:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Minimum fixed bus QoS floor frequency in kHz.

required:
  - compatible

additionalProperties: false
