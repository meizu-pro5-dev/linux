%YAML 1.2
---
$id: http://devicetree.org/schemas/media/samsung,exynos7420-mipi-csis.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7420 MIPI CSI-2 Receiver

maintainers:
  - 404698-FDU <pro5-mainline@local>

properties:
  compatible:
    const: samsung,exynos7420-mipi-csis

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: pclk
      - const: wrap
      - const: phy

  clock-frequency: true

  power-domains:
    maxItems: 1

  phys:
    maxItems: 1

  phy-names:
    const: csis

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false
