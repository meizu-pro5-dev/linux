%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/samsung,meizu-m86-audio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Meizu PRO 5 (m86) Audio Machine

maintainers:
  - 404698-FDU <pro5-mainline@local>

properties:
  compatible:
    const: samsung,meizu-m86-audio

  model:
    $ref: /schemas/types.yaml#/definitions/string

  samsung,pmu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the PMU system controller.

  samsung,rtc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the SoC RTC controller for audio clock control.

  samsung,dsp:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the eS705 SPI DSP device node.

  dsp-reset-gpios:
    maxItems: 1

  dsp-wakeup-gpios:
    maxItems: 1

  dsp-core-supply: true

  audio-amplifier:
    $ref: /schemas/types.yaml#/definitions/phandle

  hifi-cpu:
    $ref: /schemas/types.yaml#/definitions/phandle-array

  hifi-dac:
    $ref: /schemas/types.yaml#/definitions/phandle

  samsung,audio-routing:
    $ref: /schemas/types.yaml#/definitions/non-unique-string-array
    description: Audio routing pairs mapping board jacks and widgets.

  samsung,i2s-controller:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the SoC I2S DAI controller.

  samsung,audio-codec:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the WM8998 audio codec node.

  amic-bias-gpios:
    maxItems: 1

required:
  - compatible

additionalProperties: true
