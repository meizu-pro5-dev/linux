%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/samsung,exynos7420-pro5-pcie-enumeration.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Exynos7420 PRO 5 PCIe Enumeration-Only Root Complex

maintainers:
  - 404698-FDU <pro5-mainline@local>

allOf:
  - $ref: /schemas/pci/pci-bus.yaml#

properties:
  compatible:
    const: samsung,exynos7420-pro5-pcie-enumeration

  reg:
    minItems: 5
    maxItems: 5

  reg-names:
    items:
      - const: elbi
      - const: phy
      - const: pcs
      - const: dbi
      - const: config

  clocks:
    minItems: 1
    maxItems: 24

  clock-names:
    minItems: 1
    maxItems: 24

  interrupts:
    minItems: 1
    maxItems: 4

  interrupt-names:
    minItems: 1
    maxItems: 4

  reg-on-gpios:
    maxItems: 1

  samsung,pcie-sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: Phandle and offset pair to PCIe SYSREG register.

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the PMU syscon node.

  samsung,pcie-cmu-control:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the PCIe CMU control syscon node.

  num-lanes: true
  max-link-speed: true

required:
  - compatible
  - reg
  - reg-names

unevaluatedProperties: false
