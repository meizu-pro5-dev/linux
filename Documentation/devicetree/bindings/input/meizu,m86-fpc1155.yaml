%YAML 1.2
---
$id: http://devicetree.org/schemas/input/meizu,m86-fpc1155.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FPC1155 mBack Home Key & Fingerprint Sensor (Meizu PRO 5)

maintainers:
  - 404698-FDU <pro5-mainline@local>

properties:
  compatible:
    oneOf:
      - items:
          - const: meizu,m86-fpc1155
          - const: fpc,fpc_irq
      - const: fpc,fpc1150

  reg:
    maxItems: 1

  spi-max-frequency: true

  irq-gpios:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-supply: true

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: pclk
      - const: sclk

  wakeup-source: true

  controller-data:
    type: object
    additionalProperties: true

required:
  - compatible

additionalProperties: false
